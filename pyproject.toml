[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flyerdash-export"
version = "0.1.0"
description = "FlyerDash PNG export kernel: image layers and nested groups"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["flyerdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
